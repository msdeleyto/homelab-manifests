kubeProxyReplacement: true

k8sServicePort: 6443

socketLB:
  enabled: true
  hostNamespaceOnly: true

cni:
  exclusive: false

operator:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    memory: 400Mi

l2announcements:
  enabled: true

externalIPs:
  enabled: true

devices: "eth0"

k8sClientRateLimit:
  qps: 32
  burst: 64

gatewayAPI:
  enabled: false

hubble:
  relay:
    enabled: true
    prometheus:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        memory: 64Mi
  ui:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

ipam:
  mode: kubernetes

securityContext:
  capabilities:
    ciliumAgent:
    - CHOWN
    - KILL
    - NET_ADMIN
    - NET_RAW
    - IPC_LOCK
    - SYS_ADMIN
    - SYS_RESOURCE
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cleanCiliumState:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
