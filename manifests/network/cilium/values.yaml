kubeProxyReplacement: true

k8sServiceHost: ${INFRA_HA_VIP}
k8sServicePort: 6443

socketLB:
  enabled: true
  hostNamespaceOnly: true

cni:
  exclusive: false

operator:
  replicas: 1

l2announcements:
  enabled: true

externalIPs:
  enabled: true

devices: "eth0"

k8sClientRateLimit:
  qps: 32
  burst: 64

gatewayAPI:
  enabled: false

hubble:
  relay:
    enabled: true
    prometheus:
      enabled: true
  ui:
    enabled: true

ipam:
  mode: kubernetes

securityContext:
  capabilities:
    ciliumAgent:
    - CHOWN
    - KILL
    - NET_ADMIN
    - NET_RAW
    - IPC_LOCK
    - SYS_ADMIN
    - SYS_RESOURCE
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cleanCiliumState:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
