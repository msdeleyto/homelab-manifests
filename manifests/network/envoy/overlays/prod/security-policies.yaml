    kind: HTTPRoute
    name: grafana-route
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: prometheus-route
  extAuth:
    headersToExtAuth:
    - Cookie
    - X-Auth-Request-Redirect
    http:
      backendRefs:
      - group: ""
        kind: Service
        name: oauth2-proxy
        namespace: sec
        port: 80
