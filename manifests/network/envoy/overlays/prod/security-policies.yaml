apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: media-security-policy
  namespace: media
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: hometube-route
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: yubal-route
  extAuth:
    headersToExtAuth:
    - Cookie
    - X-Auth-Request-Redirect
    http:
      backendRefs:
      - group: ""
        kind: Service
        name: oauth2-proxy
        namespace: sec
        port: 80
        weight: 1
      path: /oauth2/auth
      headersToBackend:
      - X-Auth-Request-User
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: monitoring-security-policy
  namespace: monitoring
spec:
  targetRefs:
