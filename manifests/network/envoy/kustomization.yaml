apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: network

helmCharts:
- name: gateway-helm
  repo: oci://docker.io/envoyproxy
  version: 1.9.2
  valuesFile: values.yaml

resources:
- external-secret.yaml
- envoyproxy.yaml
- gateway.yaml
- auth-routes.yaml
- security-policies.yaml
