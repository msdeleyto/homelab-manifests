apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-external-secret
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    template:
      data:
        server.secretkey: ""
        admin.password: "{{ .argocdServerAdminPassword }}"
        admin.passwordMtime: "2026-02-10T13:32:47CET"
      metadata:
        labels:
          app.kubernetes.io/name: argocd-secret
          app.kubernetes.io/part-of: argocd
  data:
  - secretKey: argocdServerAdminPassword
    remoteRef:
      key: argocd-admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-config-external-secret
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: infra-config
    manifest:
      apiVersion: v1
      kind: ConfigMap
  data:
  - secretKey: INFRA_ENV
    remoteRef:
      key: infra-env
  - secretKey: INFRA_DOMAIN
    remoteRef:
      key: infra-domain
  - secretKey: INFRA_LB_IP
    remoteRef:
      key: infra-lb-ip
  - secretKey: INFRA_HA_VIP
    remoteRef:
      key: infra-ha-vip
  - secretKey: INFRA_BITWARDEN_ORG_ID
    remoteRef:
      key: infra-bitwarden-org-id
  - secretKey: INFRA_BITWARDEN_PROJECT_ID
    remoteRef:
      key: infra-bitwarden-project-id
  - secretKey: INFRA_LETS_ENCRYPT_EMAIL
    remoteRef:
      key: infra-letsencrypt-email
