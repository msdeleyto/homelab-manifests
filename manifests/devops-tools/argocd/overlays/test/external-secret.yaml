apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-config-external-secret
  namespace: devops-tools
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: infra-config
    manifest:
      apiVersion: v1
      kind: ConfigMap
  data:
  - secretKey: DOMAIN
    remoteRef:
      key: domain-test
  - secretKey: BITWARDEN_ORG_ID
    remoteRef:
      key: bitwarden-org-id
  - secretKey: BITWARDEN_PROJECT_ID
    remoteRef:
      key: bitwarden-project-id
  - secretKey: LETS_ENCRYPT_EMAIL
    remoteRef:
      key: letsencrypt-email
