apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-external-secret
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    template:
      data:
        server.secretkey: ""
        admin.password: "{{ .argocdServerAdminPassword }}"
        admin.passwordMtime: "2026-02-10T13:32:47CET"
      metadata:
        labels:
          app.kubernetes.io/name: argocd-secret
          app.kubernetes.io/part-of: argocd
  data:
  - secretKey: argocdServerAdminPassword
    remoteRef:
      key: argocd-admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-config-external-secret
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: infra-config
    manifest:
      apiVersion: v1
      kind: ConfigMap
  data:
  - secretKey: DOMAIN
    remoteRef:
      key: domain
  - secretKey: BITWARDEN_ORG_ID
    remoteRef:
      key: bitwarden-org-id
  - secretKey: BITWARDEN_PROJECT_ID
    remoteRef:
      key: bitwarden-project-id
  - secretKey: LETS_ENCRYPT_EMAIL
    remoteRef:
      key: letsencrypt-email
