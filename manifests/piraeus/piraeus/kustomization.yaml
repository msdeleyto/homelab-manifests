apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: piraeus

helmCharts:
  - name: piraeus
    repo: oci://ghcr.io/piraeusdatastore/piraeus-operator
    version: 2.12.1
    releaseName: piraeus-operator
    valuesInline:
      operator:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

  - name: linstor-cluster
    repo: oci://ghcr.io/piraeusdatastore/helm-charts
    version: 1.3.2
    releaseName: linstor-cluster
    valuesFile: values.yaml
