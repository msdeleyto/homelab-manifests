# LINSTOR satellite (node agent) configuration
satellite:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # For Talos, we need to ensure proper kernel module loading
  extraVolumes:
  - name: kernel-modules
    hostPath:
      path: /lib/modules
      type: Directory
  extraVolumeMounts:
  - name: kernel-modules
    mountPath: /lib/modules
    readOnly: true

# Final configuration
linstorCluster:
  controller:
    podTemplate:
      spec:
        containers:
        - name: linstor-controller
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  csiController:
    podTemplate:
      spec:
        containers:
        - name: csi-controller
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

linstorSatelliteConfigurations:
  - name: talos-config
    podTemplate:
      spec:
        containers:
        - name: linstor-satellite
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
          - name: kernel-modules
            mountPath: /lib/modules
            readOnly: true
        volumes:
        - name: kernel-modules
          hostPath:
            path: /lib/modules
            type: Directory
    storagePools:
      - name: data
        lvmPool:
          volumeGroup: data-vg
        source:
          hostDevices:
            - /dev/sdb

storageClasses:
  - name: piraeus
    annotations:
      storageclass.kubernetes.io/is-default-class: "true"
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    parameters:
      linstor.csi.linbit.com/storagePool: data
