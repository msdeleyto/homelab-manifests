persistence:
  enabled: true
  enableStatefulSetAutoDeletePVC: false
  storageClassName: piraeus
  accessModes:
    - ReadWriteOnce
  size: 10Gi

tempo:
  reportingEnabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
