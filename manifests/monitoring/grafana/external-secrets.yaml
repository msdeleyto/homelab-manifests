apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-external-secret
  namespace: monitoring
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-secret
    template:
      data:
        admin-user: admin
        admin-password: "{{ .adminPassword }}"
  data:
  - secretKey: adminPassword
    remoteRef:
      key: grafana-admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-contact-points-external-secret
  namespace: monitoring
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-contact-points-secret
  data:
  - secretKey: CONTACT_POINT_SLACK_RECIPIENT
    remoteRef:
      key: grafana-slack-recipient-id
  - secretKey: CONTACT_POINT_SLACK_TOKEN
    remoteRef:
      key: grafana-slack-token
