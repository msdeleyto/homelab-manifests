apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:13.6
  instances: 1
  storage:
    size: 1Gi
    storageClass: piraeus
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: keycloak-db-secret
