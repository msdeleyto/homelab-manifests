apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-secrets

helmCharts:
- name: external-secrets
  repo: https://charts.external-secrets.io
  version: 2.15.0
  releaseName: external-secrets
  valuesInline:
    installCRDs: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    webhook:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
    bitwarden-sdk-server:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      image:
        tls:
          enabled: true
          secretName: bitwarden-tls-certs
    genericTargets:
      enabled: true

resources:
- bitwarden-certs.yaml
- secret-store.yaml
