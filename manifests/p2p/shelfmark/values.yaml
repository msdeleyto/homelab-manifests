nameOverride: shelfmark
fullnameOverride: shelfmark

image:
  repository: ghcr.io/calibrain/shelfmark
  tag: v1.7.1@sha256:c5a0df5c859f5b2d8b77bcd13979c1d695599e8674c40c3cc1053e6133510fc5

serviceAccount:
  create: false

service:
  type: ClusterIP
  ports:
  - name: http
    port: 8084
    targetPort: http
    protocol: TCP

ports:
- name: http
  containerPort: 8084
  protocol: TCP

httpRoute:
  enabled: true
  parentRefs:
  - name: cluster-gateway
    group: gateway.networking.k8s.io
    kind: Gateway
    sectionName: https
    namespace: network
  hostnames:
  - "shelfmark.${DOMAIN}"
  port: 8084
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

livenessProbe:
  httpGet:
    path: /api/health
    port: http

storage:
  create: true
  name: shelfmark-config
  className: piraeus
  accessModes:
  - ReadWriteOnce
  size: 1Gi

env:
- name: PUID
  value: "1000"
- name: PGID
  value: "1000"
- name: DOCKERMODE
  value: "true"

volumes:
- name: config
  persistentVolumeClaim:
    claimName: shelfmark-config
- name: books
  nfs:
    server: nas.homelab
    path: /volume1/data/media/books/new

volumeMounts:
- name: config
  mountPath: /config
- name: books
  mountPath: /books

resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    memory: 192Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: NotIn
          values:
          - "true"
