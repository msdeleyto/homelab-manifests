apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slskd-external-secret
  namespace: p2p
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: slskd-secret
  data:
  - secretKey: SLSKD_SLSK_USERNAME
    remoteRef:
      key: slskd-user
  - secretKey: SLSKD_SLSK_PASSWORD
    remoteRef:
      key: slskd-password
  - secretKey: DEST_EMAIL_ADDRESS
    remoteRef:
      key: scan-dest-email-address
  - secretKey: ORIGIN_EMAIL_AUTHUSER
    remoteRef:
      key: scan-origin-email-auth-user
  - secretKey: ORIGIN_EMAIL_AUTH_PASS
    remoteRef:
      key: scan-origin-email-auth-pass
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slskd-vpn-external-secret
  namespace: p2p
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: slskd-vpn-secret
  data:
  - secretKey: WIREGUARD_PRIVATE_KEY
    remoteRef:
      key: vpn-wireguard-private-key
