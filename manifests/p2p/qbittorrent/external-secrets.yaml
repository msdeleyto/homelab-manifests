apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-external-secret
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: qbittorrent-secret
  data:
  - secretKey: QBT_API_PASSWORD
    remoteRef:
      key: qbittorrent-api-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-vpn-external-secret
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: qbittorrent-vpn-secret
  data:
  - secretKey: WIREGUARD_PRIVATE_KEY
    remoteRef:
      key: vpn-wireguard-private-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-config-external-secret
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: qbittorrent-config
    template:
      data:
        qBittorrent.conf: |
          [BitTorrent]
          Session\DefaultSavePath=/downloads/complete
          Session\Port=6881
          Session\TempPath=/downloads/incomplete
          Session\TempPathEnabled=true

          [AutoRun]
          enabled=true
          program=/scan_file {{ "{{ .destEmailAddress }}" }} /quarantine /var/log/cerberus %F

          [Preferences]
          WebUI\AuthSubnetWhitelist=10.0.0.0/16
          WebUI\AuthSubnetWhitelistEnabled=true
          WebUI\Password_PBKDF2="@ByteArray({{ "{{ .webuiPassword }}" }})"
  data:
  - secretKey: webuiPassword
    remoteRef:
      key: qbittorrent-webui-password
  - secretKey: destEmailAddress
    remoteRef:
      key: scan-dest-email-address
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-ssmtp-config-external-secret
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: qbittorrent-ssmtp-config
    template:
      data:
        ssmtp.conf: |
          root=postmaster
          SERVER={{ "{{ .originEmailAuthUser }}" }}

          mailhub=smtp.gmail.com:587
          AuthUser={{ "{{ .originEmailAuthUser }}" }}
          Authpass={{ "{{ .originEmailAuthPass }}" }}
          UseTLS=YES
          UseSTARTTLS=YES

          FromLineOverride=YES
  data:
  - secretKey: originEmailAuthUser
    remoteRef:
      key: scan-origin-email-auth-user
  - secretKey: originEmailAuthPass
    remoteRef:
      key: scan-origin-email-auth-pass
