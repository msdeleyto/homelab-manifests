apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devops-tools
  namespace: devops-tools
spec:
  generators:
    - list:
        elements:
          - name: argocd
            path: ./manifests/devops-tools/argocd/overlays/prod
          # - name: renovate
          #   path: ./manifests/devops-tools/renovate/overlays/prod
  template:
    metadata:
      name: '{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/msdeleyto/homelab-manifests.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: devops-tools
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/audit-version: latest
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
