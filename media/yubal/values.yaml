image:
  repository: ghcr.io/guillevc/yubal
  tag: 0.10.0@sha256:1447663d19eb69e4c6c6d274e979a99c4013a7d0a7666ca1bf2127612cd639eb

serviceAccount:
  create: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 100
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP

ports:
- name: http
  containerPort: 8000
  protocol: TCP

httpRoute:
  enabled: false

livenessProbe:
  httpGet:
    path: /_stcore/health
    port: http

storage:
  create: false

env:
- name: YUBAL_AUDIO_FORMAT
  value: "opus"
- name: YUBAL_AUDIO_QUALITY
  value: "0"
- name: YUBAL_SCHEDULER_ENABLED
  value: "true"
- name: YUBAL_SCHEDULER_CRON
  value: "0 0 * * *"
- name: YUBAL_FETCH_LYRICS
  value: "false"
- name: YUBAL_DOWNLOAD_UGC
  value: "true"
- name: YUBAL_REPLAYGAIN
  value: "true"
- name: YUBAL_JOB_TIMEOUT_SECONDS
  value: "1800"
- name: YUBAL_TZ
  value: "UTC"
- name: YUBAL_HOST
  value: "0.0.0.0"
- name: YUBAL_PORT
  value: "8000"
- name: YUBAL_DATA
  value: "/app/data"
- name: YUBAL_CONFIG
  value: "/app/config"
- name: YUBAL_LOG_LEVEL
  value: "INFO"
- name: YUBAL_ASCII_FILENAMES
  value: "false"
- name: YUBAL_TEMP
  value: "/tmp"
- name: YUBAL_CORS_ORIGINS
  value: "[\"*.${INFRA_DOMAIN}\"]"

volumeMounts:
- name: config
  mountPath: /app/config
- name: data
  mountPath: /app/data

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: NotIn
          values:
          - "true"
