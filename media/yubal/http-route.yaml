apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yubal-route
spec:
  parentRefs:
  - name: cluster-gateway
    group: gateway.networking.k8s.io
    kind: Gateway
    sectionName: https
    namespace: network
  hostnames:
  - "yubal.${INFRA_DOMAIN}"
  rules:
  - backendRefs:
      - kind: Service
        name: yubal-miguel
        port: 8000
        weight: 1
    matches:
    - headers:
      - name: X-Auth-Request-User
        value: miguel
  - backendRefs:
      - kind: Service
        name: yubal-ari
        port: 8000
        weight: 1
    matches:
    - headers:
      - name: X-Auth-Request-User
        value: ari
