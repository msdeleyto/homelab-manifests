[proxmox]
pve ansible_host=192.168.10.2 ansible_user=root

[proxmox:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/pve.id_ed25519
ssh_public_key_file=~/.ssh/pve.id_ed25519.pub

# GPU passthrough — AMD Lucienne iGPU
gpu_pci_ids=["1002:164c","1002:1637"]
gpu_mapping_name=amdgpu
gpu_pci_addresses=["0000:04:00.0","0000:04:00.1"]
